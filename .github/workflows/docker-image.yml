name: Build, Push to ACR & Deploy to VM

on:
  push:
    branches:
      - dev
      - staging
      - prod

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    outputs:
      IMAGE_TAG: ${{ steps.settag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name testingACRHello

      - name: Set IMAGE_TAG based on branch
        id: settag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            TAG=dev
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
            TAG=staging
          else
            TAG=prod
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "::set-output name=IMAGE_TAG::$TAG"

      - name: Build Docker image
        run: |
          docker build -t testingacrhello.azurecr.io/myapp:${IMAGE_TAG} .

      - name: Push Docker image
        run: docker push testingacrhello.azurecr.io/myapp:${IMAGE_TAG}


  deploy-to-vm:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy on Azure VM
        run: |
          TAG=${{ needs.build.outputs.IMAGE_TAG }}

          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} << 'EOF'
docker login testingacrhello.azurecr.io -u ${{ secrets.ACR_USERNAME }} -p ${{ secrets.ACR_PASSWORD }}

docker pull testingacrhello.azurecr.io/myapp:${TAG}

docker rm -f myapp || true

docker run -d --name myapp --restart unless-stopped -p 9000:9000 \
  testingacrhello.azurecr.io/myapp:${TAG}
EOF
