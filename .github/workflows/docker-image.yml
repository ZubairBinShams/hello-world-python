name: Build, Push and Deploy

on:
  push:
    branches:
      - dev
      - staging
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      IMAGE_TAG: ${{ steps.settag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name testingACRHello

      - name: Set IMAGE_TAG
        id: settag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
          TAG=dev
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
          TAG=staging
          else
          TAG=prod
          fi

          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Build Docker image
        # IMAGE_TAG is available here via $GITHUB_ENV
        run: docker build -t testingacrhello.azurecr.io/myapp:${IMAGE_TAG} .

      - name: Push Docker image
        run: docker push testingacrhello.azurecr.io/myapp:${IMAGE_TAG}

  deploy:
    # This job runs only after the 'build' job successfully completes
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to Azure VM
        run: |
          # Get the image tag from the output of the 'build' job
          TAG="${{ needs.build.outputs.IMAGE_TAG }}"
          
          # Execute commands on the remote VM via SSH using a here document (<<-'EOF').
          # The hyphen ('-') allows the shell to ignore the leading indentation, which is necessary for YAML syntax.
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} <<-'EOF'
          # FIX: Use explicit flags with quoting for all secrets, 
          # ensuring the password is piped securely via STDIN, 
          # which should fix the "requires at most 1 argument" error.
          echo "${{ secrets.ACR_PASSWORD }}" | docker login testingacrhello.azurecr.io --username "${{ secrets.ACR_USERNAME }}" --password-stdin
          
          # FIX: The "invalid reference format" error happens if $TAG is empty or contains whitespace.
          # We ensure $TAG is quoted when used in image pull/run commands.
          # Note: The $TAG expansion happens on the remote machine.
          docker pull testingacrhello.azurecr.io/myapp:"${TAG}"
          docker rm -f myapp || true
          docker run -d --name myapp --restart unless-stopped -p 9000:9000 testingacrhello.azurecr.io/myapp:"${TAG}"
          EOF
