name: Build, Push and Deploy

on:
  push:
    branches:
      - dev
      - staging
      - prod

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      IMAGE_TAG: ${{ steps.settag.outputs.IMAGE_TAG }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name testingACRHello

      - name: Set IMAGE_TAG
        id: settag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
          TAG=dev
          elif [[ "${GITHUB_REF_NAME}" == "staging" ]]; then
          TAG=staging
          else
          TAG=prod
          fi

          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "IMAGE_TAG=$TAG" >> $GITHUB_OUTPUT
      - name: Build Docker image
        # IMAGE_TAG is available here via $GITHUB_ENV
        run: docker build -t testingacrhello.azurecr.io/myapp:${IMAGE_TAG} .

      - name: Push Docker image
        run: docker push testingacrhello.azurecr.io/myapp:${IMAGE_TAG}

  deploy:
    # This job runs only after the 'build' job successfully completes
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      
      - name: Deploy to VM
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VM_USERNAME }}@${{ secrets.VM_HOST }} <<EOF
          echo "Connected to VM"

          echo "ACR login..."
          echo "${{ secrets.ACR_PASSWORD }}" | docker login testingacrhello.azurecr.io -u ${{ secrets.ACR_USERNAME }} --password-stdin
      
          docker pull testingacrhello.azurecr.io/myapp:${IMAGE_TAG}
          docker rm -f myapp || true
          docker run -d --name myapp -p 9000:9000 testingacrhello.azurecr.io/myapp:${IMAGE_TAG}

          echo "Done"
          EOF
