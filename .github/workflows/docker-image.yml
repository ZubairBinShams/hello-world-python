name: Build, Push to ACR & Deploy to VM

on:
  push:
    branches: [dev, prod]

jobs:

  build:
    runs-on: ubuntu-latest
    outputs:
      IMAGE_TAG: ${{ steps.settag.outputs.TAG }}

    steps:
      - uses: actions/checkout@v3

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set Image Tag
        id: settag
        run: |
          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            TAG=dev
          else
            TAG=prod
          fi
          echo "TAG=$TAG" >> $GITHUB_OUTPUT

      - name: Login to ACR
        run: az acr login --name testingacrhello

      - name: Build Image
        run: |
          docker build -t testingacrhello.azurecr.io/myapp:${{ steps.settag.outputs.TAG }} .

      - name: Push Image
        run: |
          docker push testingacrhello.azurecr.io/myapp:${{ steps.settag.outputs.TAG }}

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy on VM
        run: |
          TAG=${{ needs.build.outputs.IMAGE_TAG }}

          ssh -o StrictHostKeyChecking=no azureuser@${{ secrets.VM_HOST }} <<EOF

          echo "Logging into ACR..."
          echo "${{ secrets.ACR_PASSWORD }}" | docker login testingacrhello.azurecr.io \
            -u ${{ secrets.ACR_USERNAME }} --password-stdin

          echo "Pulling image..."
          docker pull testingacrhello.azurecr.io/myapp:$TAG

          echo "Stopping old container..."
          docker rm -f myapp || true

          echo "Starting new container..."
          docker run -d --name myapp --restart unless-stopped -p 9000:9000 \
            testingacrhello.azurecr.io/myapp:$TAG

          docker ps
          EOF
